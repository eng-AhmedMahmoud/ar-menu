# ar-menu.devya.dev on the Devya VPS: nginx serves the Next static export from
# /home/devya/projects/ar-menu/current (a symlink to releases/<sha>, see
# scripts/deploy-vps.sh). AR needs HTTPS: certbot --nginx adds the 443 server and
# the http -> https redirect (installed by `bash scripts/deploy-vps.sh --setup`).
server {
    listen 80;
    listen [::]:80;
    server_name ar-menu.devya.dev;

    root /home/devya/projects/ar-menu/current;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Quick Look refuses a .usdz unless the Content-Type is exact; model-viewer
    # wants the glTF binary type (was next.config headers() on Vercel).
    location /models/ {
        types {
            model/vnd.usdz+zip usdz;
            model/gltf-binary glb;
        }
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
    error_page 404 /404.html;
}
